<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🪷</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Animation (Lotus Spinner Only - No Text) -->
  <div id="loading-overlay">
    <svg class="lotus-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5c-2.8 4.2-4.5 9-4.5 13a4.5 4.5 0 0 0 9 0c0-4-1.7-8.8-4.5-13Z" />
      <path d="M6.5 7.5c-2.8 3.5-4 7.2-4 9.5a4.5 4.5 0 0 0 7.8 3.1c-1.5-2.6-2.6-6.5-3.8-12.6Z" />
      <path d="M17.5 7.5c2.8 3.5 4 7.2 4 9.5a4.5 4.5 0 0 1-7.8 3.1c1.5-2.6 2.6-6.5 3.8-12.6Z" />
      <path d="M12 16.5v5.5" />
    </svg>
  </div>

  <!-- Camera Screenshot Flash Effect -->
  <div id="flash-overlay"></div>

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>

  <!-- UI Controls Layer (Zero Text - Buttons Only) -->
  <div class="ui-layer">
    
    <!-- Top Floating Toolbar -->
    <header class="top-bar">
      <!-- Left utility group: Music & Ambient sound -->
      <div class="top-group glass-panel">
        <button id="btn-music" class="btn icon-btn" aria-label="Music">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </button>

        <button id="btn-ambient" class="btn icon-btn" aria-label="Ambient Sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>

      <!-- Right utility group: Glow Aura & Camera Snapshot -->
      <div class="top-group glass-panel">
        <button id="btn-glow" class="btn icon-btn" aria-label="Glow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            <path d="M5 3v4"/>
            <path d="M19 17v4"/>
            <path d="M3 5h4"/>
            <path d="M17 19h4"/>
          </svg>
        </button>

        <button id="btn-camera" class="btn icon-btn" aria-label="Snapshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Side Actions (Pluck Petal, Restore / Re-bloom, Auto Bloom) -->
    <aside class="side-actions glass-panel">
      <!-- Pluck a single petal -->
      <button id="btn-pluck" class="btn icon-btn" aria-label="Pluck Petal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8 6 5 11 5 15a7 7 0 0 0 14 0c0-4-3-9-7-13Z"/>
          <path d="M12 9v7"/>
        </svg>
      </button>

      <!-- Restore / Re-bloom all petals -->
      <button id="btn-reset" class="btn icon-btn" aria-label="Restore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15.54-6.36L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15.54 6.36L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
      </button>

      <!-- Auto-bloom animation toggle -->
      <button id="btn-autobloom" class="btn icon-btn" aria-label="Auto Bloom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2a4 4 0 0 0-4 4c0 3 4 5 4 5s4-2 4-5a4 4 0 0 0-4-4Z"/>
          <path d="M12 22a4 4 0 0 0 4-4c0-3-4-5-4-5s-4 2-4 5a4 4 0 0 0 4 4Z"/>
          <path d="M2 12a4 4 0 0 0 4 4c3 0 5-4 5-4s-2-4-5-4a4 4 0 0 0-4 4Z"/>
          <path d="M22 12a4 4 0 0 0-4-4c-3 0-5 4-5 4s2 4 5 4a4 4 0 0 0 4-4Z"/>
        </svg>
      </button>
    </aside>

    <!-- Bottom Navigation Dock -->
    <footer class="bottom-bar">
      <nav class="bottom-dock glass-panel">
        
        <!-- Scene Presets: Solo, Trio, Pond -->
        <button id="btn-scene-solo" class="btn icon-btn active" aria-label="Single Lotus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5C9.2 7.5 7.5 12 7.5 15.5a4.5 4.5 0 0 0 9 0c0-3.5-1.7-8-4.5-12Z"/>
            <path d="M12 16v6"/>
            <path d="M8 22h8"/>
          </svg>
        </button>

        <button id="btn-scene-trio" class="btn icon-btn" aria-label="Trio Arrangement">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c-1.8 2.8-3 6.5-3 9a3 3 0 0 0 6 0c0-2.5-1.2-6.2-3-9Z"/>
            <path d="M6 7c-1.2 2-2 4.5-2 6.5a2.2 2.2 0 0 0 4.4 0C8.4 11.5 7.6 9 6 7Z"/>
            <path d="M18 7c-1.2 2-2 4.5-2 6.5a2.2 2.2 0 0 0 4.4 0C20.4 11.5 19.6 9 18 7Z"/>
            <path d="M12 15v7"/>
          </svg>
        </button>

        <button id="btn-scene-pond" class="btn icon-btn" aria-label="Lotus Pond">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c-1.8 2.8-3 6-3 8.5a3 3 0 0 0 6 0c0-2.5-1.2-5.7-3-8.5Z"/>
            <path d="M2 17c3-1 6 1 10 0s7-1 10 0"/>
            <path d="M2 21c3-1 6 1 10 0s7-1 10 0"/>
          </svg>
        </button>

        <div class="dock-divider"></div>

        <!-- Time of Day / Atmosphere: Day, Sunset, Night -->
        <button id="btn-time-day" class="btn icon-btn" aria-label="Day">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>

        <button id="btn-time-sunset" class="btn icon-btn active-gold" aria-label="Sunset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 10V2"/>
            <path d="m4.93 10.93 1.41-1.41"/>
            <path d="M2 16h20"/>
            <path d="M4 20h16"/>
            <path d="m19.07 10.93-1.41-1.41"/>
            <path d="M16 16a4 4 0 0 0-8 0"/>
          </svg>
        </button>

        <button id="btn-time-night" class="btn icon-btn" aria-label="Night">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            <path d="M19 3v4"/>
            <path d="M21 5h-4"/>
          </svg>
        </button>

        <div class="dock-divider"></div>

        <!-- Bloom Scrub Slider (Bud icon -> Blossom icon) -->
        <div class="slider-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3C9.5 6.5 8.5 12 8.5 15.5a3.5 3.5 0 0 0 7 0c0-3.5-1-9-3.5-12.5Z"/>
            <path d="M12 16v6"/>
          </svg>

          <input id="slider-bloom" type="range" min="0.05" max="1.0" step="0.01" value="1.0" aria-label="Bloom Slider" />

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2.5"/>
            <path d="M12 2a3.5 3.5 0 0 0-3.5 3.5c0 2.5 3.5 4.5 3.5 4.5s3.5-2 3.5-4.5A3.5 3.5 0 0 0 12 2Z"/>
            <path d="M12 22a3.5 3.5 0 0 0 3.5-3.5c0-2.5-3.5-4.5-3.5-4.5s-3.5 2-3.5 4.5A3.5 3.5 0 0 0 12 22Z"/>
            <path d="M2 12a3.5 3.5 0 0 0 3.5 3.5c2.5 0 4.5-3.5 4.5-3.5s-2-3.5-4.5-3.5A3.5 3.5 0 0 0 2 12Z"/>
            <path d="M22 12a3.5 3.5 0 0 0-3.5-3.5c-2.5 0-4.5 3.5-4.5 3.5s2 3.5 4.5 3.5A3.5 3.5 0 0 0 22 12Z"/>
          </svg>
        </div>

      </nav>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
